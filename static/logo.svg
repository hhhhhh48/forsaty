<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="figure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- توهج داخلي -->
  <circle cx="60" cy="55" r="50" fill="#ffffff" opacity="0.08"/>

  <!-- اليد الممدودة (من الأسفل) -->
  <path d="M 25 105
           Q 30 80, 45 75
           Q 55 72, 60 78
           L 60 95
           L 70 95
           L 70 78
           Q 75 72, 85 75
           Q 100 80, 105 105
           Z"
        fill="url(#hand)" opacity="0.95"/>

  <!-- الكف (أصابع مبسطة) -->
  <path d="M 45 78 Q 42 68, 48 65 Q 52 65, 52 70 L 52 82 Z"
        fill="url(#hand)"/>
  <path d="M 55 76 Q 54 65, 60 63 Q 64 64, 63 72 L 63 82 Z"
        fill="url(#hand)"/>
  <path d="M 65 78 Q 66 68, 72 68 Q 76 70, 74 78 L 74 85 Z"
        fill="url(#hand)"/>

  <!-- الشاب (يرتفع) -->
  <circle cx="60" cy="38" r="9" fill="url(#figure)"/>
  <path d="M 52 52 Q 60 48, 68 52 L 70 68 Q 60 72, 50 68 Z"
        fill="url(#figure)"/>

  <!-- ذراعان مرفوعتان -->
  <path d="M 52 54 Q 45 45, 42 35" stroke="url(#figure)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 68 54 Q 75 45, 78 35" stroke="url(#figure)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- نجوم الأمل (مبسطة) -->
  <circle cx="35" cy="30" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="88" cy="28" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="90" cy="45" r="2.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="30" cy="48" r="1.8" fill="#ffffff" opacity="0.85"/>

  <!-- هالة على الرأس -->
  <circle cx="60" cy="20" r="3" fill="#10b981" opacity="0.9"/>
</svg>
