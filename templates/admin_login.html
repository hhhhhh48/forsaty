{% extends "base.html" %}

{% block title %}دخول الإدارة — فرصتي{% endblock %}

{% block content %}

<section class="px-6 py-20">
  <div class="max-w-md mx-auto">

    <div class="text-center mb-8">
      <div class="text-6xl mb-4">🔐</div>
      <h1 class="text-3xl font-black gradient-text mb-2">لوحة الإدارة</h1>
      <p class="text-gray-400">الدخول للأدمن فقط</p>
    </div>

    <div class="glass rounded-2xl p-8">
      {% if error %}
      <div class="bg-red-500/20 border border-red-500/30 rounded-xl p-4 mb-5 text-red-300 text-center">
        ❌ {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/admin/login" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-300 mb-2">كلمة السر</label>
          <input type="password" name="password" required autofocus
                 class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition"
                 placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg">
          🔓 دخول
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/" class="text-gray-400 hover:text-emerald-400 text-sm">
          ← العودة للرئيسية
        </a>
      </div>
    </div>

  </div>
</section>

{% endblock %}
